version: "3.8"

services:
  jobyaari_db:
    image: qdrant/qdrant:latest
    container_name: jobyaari_db
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - jobyaari_qdrant_storage:/qdrant/storage
    environment:
      #- QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG__LEVEL=info

volumes:
  jobyaari_qdrant_storage: